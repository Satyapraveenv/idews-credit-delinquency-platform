# ============================================================
# IDEWS — Model Configuration
# ============================================================

model:
  name: "idews_delinquency_predictor"
  version: "1.0.0"
  algorithm: "XGBoost"
  framework: "xgboost"
  description: "Credit card delinquency early warning model — predicts default probability 60-90 days in advance"

  # XGBoost hyperparameters (tuned for credit risk)
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 4.0       # Handles class imbalance (default ~22% in UCI)
    eval_metric: "auc"
    use_label_encoder: false
    random_state: 42
    early_stopping_rounds: 30

  # Training split
  train_test_split: 0.2
  validation_split: 0.1
  random_state: 42

  # Performance thresholds (SLAs)
  thresholds:
    min_auc_roc: 0.80           # Minimum acceptable AUC-ROC
    min_ks_statistic: 0.35      # KS statistic (separation power)
    max_false_positive_rate: 0.08  # Max FPR at operating threshold
    operating_threshold: 0.40   # Decision boundary for binary flag

# SHAP settings
explainability:
  compute_shap: true
  n_shap_samples: 1000          # Number of background samples for SHAP
  top_features: 10              # Top N features to return in API response
  save_shap_plots: true

# MLflow settings
mlflow:
  experiment_name: "idews_delinquency_model"
  tracking_uri: "mlruns"        # Local; change to GCS/Databricks URI for cloud
  model_registry_name: "IDEWS_DelinquencyModel"
  auto_log: true

# Scoring API SLA
serving:
  max_response_ms: 50           # Sub-50ms SLA target
  default_batch_size: 1         # Real-time: 1; Batch: up to 10,000
